<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Hangman - Spiel</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: url('images/Friedhof.png') no-repeat center center fixed;
            background-size: cover;

            color: #333;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            padding: 10px;
        }


        /* =========================================
           SPIEL-CONTAINER
           ========================================= */

        .game-container {
            width: min(420px, 94vw);
            max-height: 96vh;
            max-height: 96dvh;

            text-align: center;

            border: 2px solid #333;
            border-radius: 12px;

            padding: 20px;

            background: rgba(0, 0, 0, 0.65);

            position: relative;

            animation: fadeIn 1s ease-out;

            overflow-y: auto;
            overflow-x: hidden;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.5);

            -webkit-overflow-scrolling: touch;
        }


        /* =========================================
           ANIMATION
           ========================================= */

        @keyframes fadeIn {

            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================
           TITEL
           ========================================= */

        h1 {
            font-size: clamp(20px, 6vw, 28px);

            line-height: 1.2;

            margin: 0 0 20px 0;

            color: white;

            word-break: break-word;
        }


        /* =========================================
   WORT
   ========================================= */

.word {
    width: 100%;
    min-height: 50px;
    height: auto;

    margin: 0 auto 8px auto;

    display: flex;
    justify-content: center;
    align-items: center;

    flex-wrap: wrap;

    color: #39ff14;

    font-size: clamp(22px, 7vw, 30px);
    line-height: 1.35;

    overflow: visible;

    /* Wichtig für lange Wörter */
    overflow-wrap: anywhere;
    word-break: normal;

    padding: 0 2px;
}


/* Jeder Buchstabe */

.word span {
    display: inline-flex;

    width: 26px;
    min-width: 26px;
    height: 38px;

    justify-content: center;
    align-items: center;

    text-align: center;

    flex: 0 0 26px;
}


/* Wort bei Niederlage */

#wordDisplay.lose {
    color: red;
    font-weight: bold;
}


        /* =========================================
           FALSCHE BUCHSTABEN
           ========================================= */

        .incorrect-letters {
            margin-top: 10px;
            margin-left: 0;

            min-height: 24px;

            font-size: 17px;

            color: red;

            text-align: left;

            word-break: break-word;
        }


        /* =========================================
           STATUS
           ========================================= */

        .status {
            font-size: 19px;

            font-weight: bold;

            line-height: 1.3;

            margin-top: 15px;

            min-height: 30px;

            color: white;
        }


        /* =========================================
           GALGEN
           ========================================= */

        .gallows-container {
            margin-top: 15px;

            text-align: center;
        }


        #gallowsImage {
            display: block;

            width: min(200px, 55vw);

            max-height: 190px;

            height: auto;

            object-fit: contain;

            margin: 0 auto;
        }


        /* =========================================
           EINGABE
           ========================================= */

        .input-container {
            margin-top: 15px;

            display: flex;

            justify-content: center;
            align-items: center;

            gap: 16px;
        }


        .letter-input {
            width: 45px;

            min-width: 45px;

            height: 45px;

            font-size: 22px;

            text-align: center;

            margin: 0;

            border-radius: 6px;

            border: 2px solid #aaa;

            outline: none;

            text-transform: lowercase;
        }


           /* =========================================
           RICHTIGE / FALSCHE EINGABE
           ========================================= */

        .letter-input.correct {
            border: 2px solid green;

            background-color: #e8f5e9;

            animation: glowGreen 0.5s ease-in-out;
        }


        .letter-input.incorrect {
            border: 2px solid red;

            background-color: #ffebee;

            animation: glowRed 0.5s ease-in-out;
        }


        @keyframes glowGreen {

            0% {
                box-shadow:
                    0 0 5px green,
                    0 0 10px green,
                    0 0 15px green;
            }

            50% {
                box-shadow:
                    0 0 10px green,
                    0 0 20px green,
                    0 0 25px green;
            }

            100% {
                box-shadow:
                    0 0 5px green,
                    0 0 10px green,
                    0 0 15px green;
            }

        }


        @keyframes glowRed {

            0% {
                box-shadow:
                    0 0 5px red,
                    0 0 10px red,
                    0 0 15px red;
            }

            50% {
                box-shadow:
                    0 0 10px red,
                    0 0 20px red,
                    0 0 25px red;
            }

            100% {
                box-shadow:
                    0 0 5px red,
                    0 0 10px red,
                    0 0 15px red;
            }

        }


        /* =========================================
           GEWONNEN / VERLOREN
           ========================================= */

        .win-message {
            color: #39ff14;
        }


        .lose-message {
            color: red;
        }


        /* =========================================
           FLASH
           ========================================= */

        @keyframes flash {

            0% {
                color: orange;
            }

            50% {
                color: yellow;
            }

            100% {
                color: orange;
            }

        }


        .status.flash {
            animation: flash 0.7s ease-in-out 0s 3;
        }


        /* =========================================
   BUTTONS
   ========================================= */

.reset-btn,
.goBack-btn {
    width: auto;
    height: 36px;
    min-height: 36px;

    padding: 0 14px;

    font-size: 13px;
    line-height: 36px;

    cursor: pointer;

    color: white;

    border: none;
    border-radius: 5px;

    position: static;

    margin: 10px 3px 0 3px;

    transition:
        background-color 0.2s,
        transform 0.2s;
}


/* Reset = ROT */

.reset-btn {
    background-color: #e53935;
}

.reset-btn:hover {
    background-color: #c62828;
}


/* Zurück = BLAU */

.goBack-btn {
    background-color: #2196F3;
}

.goBack-btn:hover {
    background-color: #1976D2;
}


/* =========================================
   RATEN-BUTTON
   ========================================= */

.input-container button {
    width: 80px;
    height: 36px;
    min-height: 36px;

    padding: 0;

    font-size: 14px;

    cursor: pointer;

    background-color: #4CAF50;

    color: white;

    border: none;
    border-radius: 5px;

    transition:
        background-color 0.2s,
        transform 0.2s;
}

.input-container button:hover {
    background-color: #45a049;
}


        /* =========================================
           TOUCH-GERÄTE
           ========================================= */

        @media (hover: none) {

            button:hover {
                transform: none;
            }

        }


        /* =========================================
           HANDY
           ========================================= */

        @media (max-width: 600px) {

    body {
        align-items: flex-start;
        padding: 8px;
    }

    .game-container {
        width: 94vw;
        max-width: 380px;
        padding: 14px 12px;

        max-height: none;
        overflow: visible;
    }

    h1 {
        font-size: 21px;
        margin-bottom: 8px;
    }

    .word {
        min-height: 50px;
        font-size: 26px;
        margin-bottom: 4px;
    }

    .word span {
        width: 26px;
        min-width: 26px;
    }

    .incorrect-letters {
        font-size: 14px;
        margin-top: 4px;
    }

    .status {
        font-size: 16px;
        margin-top: 6px;
        min-height: 22px;
    }

    .gallows-container {
        margin-top: 4px;
    }

    #gallowsImage {
        width: 150px;
        max-height: 145px;
    }

    .input-container {
        margin-top: 8px;
        gap: 12px;
    }

    .letter-input {
        width: 42px;
        min-width: 42px;
        height: 40px;

        font-size: 21px;
    }

    .input-container button {
        width: 80px;
        height: 36px;
        min-height: 36px;

        font-size: 14px;
    }

    .reset-btn,
    .goBack-btn {
        height: 34px;
        min-height: 34px;

        line-height: 34px;

        font-size: 12px;

        padding: 0 12px;

        margin-top: 8px;
    }
}


        /* =========================================
           SEHR KLEINE HANDYS
           ========================================= */

        @media (max-width: 380px) {

    .game-container {
        width: 98vw;
        padding: 12px 8px;
    }

    h1 {
        font-size: 19px;
        margin-bottom: 8px;
    }

    .word {
        font-size: 23px;
        line-height: 1.3;
        min-height: 45px;
        padding: 0;
    }

    .word span {
        width: 22px;
        min-width: 22px;
        height: 32px;

        flex-basis: 22px;
    }

    .incorrect-letters {
        font-size: 14px;
    }

    .status {
        font-size: 16px;
    }

    #gallowsImage {
        width: 42vw;
        max-height: 145px;
    }

    .letter-input {
        width: 42px;
        min-width: 42px;
        height: 40px;
        font-size: 21px;
    }

    .input-container button {
        width: 75px;
        height: 40px;
        min-height: 40px;
        font-size: 14px;
    }

    .reset-btn,
    .goBack-btn {
        height: 34px;
        min-height: 34px;

        line-height: 34px;

        font-size: 12px;

        padding: 0 12px;

        margin-top: 7px;
    }
}


        /* =========================================
           SEHR KLEINE HÖHE
           z.B. Handy im Querformat
           ========================================= */

        @media (max-height: 600px) {

            .game-container {
                max-height: 98dvh;

                padding: 10px;
            }


            h1 {
                margin-bottom: 5px;
            }


            .word {
                min-height: 45px;

                margin-bottom: 3px;
            }


            .incorrect-letters {
                margin-top: 3px;
            }


            .status {
                margin-top: 3px;
            }


            .gallows-container {
                margin-top: 3px;
            }


            #gallowsImage {
                width: 130px;

                max-height: 120px;
            }


            .input-container {
                margin-top: 5px;
            }


            .reset-btn,
            .goBack-btn {
                margin-top: 5px;

                min-height: 42px;
            }

        }

    </style>
</head>


<body>

    <div class="game-container">

        <h1 id="gameTitle">Hangman</h1>


        <div class="word" id="wordDisplay">
            _ _ _ _ _
        </div>


        <div class="incorrect-letters" id="incorrectLetters"></div>


        <div class="status" id="status">
            Versuche, das Wort zu erraten!
        </div>


        <div class="gallows-container">

            <img
                id="gallowsImage"
                src="images/hm01.png"
                alt="Galgenmännchen"
            >

        </div>


        <div class="input-container">

            <input
                type="text"
                id="letterInput"
                class="letter-input"
                maxlength="1"
                autocomplete="off"
                autocapitalize="none"
                spellcheck="false"
                autofocus
            >

            <button
                type="button"
                onclick="guessLetter()"
            >
                Raten
            </button>

        </div>


        <button
            type="button"
            class="reset-btn"
            onclick="resetGame()"
        >
            Reset
        </button>


        <button
            type="button"
            class="goBack-btn"
            onclick="goBack()"
        >
            Zurück zur Auswahl
        </button>

    </div>


    <script src="words.js"></script>

<script>
    /* =========================================
       SPIELVARIABLEN
       ========================================= */

    let selectedWord = '';
    let guessedLetters = [];
    let incorrectLetters = [];
    let remainingAttempts = 10;
    let gameOver = false;
    let flashTimeout = null;


    /* =========================================
       GALGENBILDER

       Index 0 = Start
       Index 1 = 1 Fehler
       ...
       Index 10 = 10 Fehler / verloren
       ========================================= */

    const gallowsImages = [
        "images/hm01.png",
        "images/hm02.png",
        "images/hm03.png",
        "images/hm04.png",
        "images/hm05.png",
        "images/hm06.png",
        "images/hm07.png",
        "images/hm08.png",
        "images/hm09.png",
        "images/hm010.png",
        "images/hm011.png"
    ];


    /* =========================================
       HTML-ELEMENTE
       ========================================= */

    const gameTitle =
        document.getElementById('gameTitle');

    const wordDisplay =
        document.getElementById('wordDisplay');

    const incorrectLettersDisplay =
        document.getElementById('incorrectLetters');

    const statusEl =
        document.getElementById('status');

    const gallowsImage =
        document.getElementById('gallowsImage');

    const letterInput =
        document.getElementById('letterInput');


    /* =========================================
       KATEGORIE AUS URL HOLEN
       ========================================= */

    const urlParams =
        new URLSearchParams(window.location.search);

    const category =
        urlParams.get('category');


    /* =========================================
       KATEGORIE PRÜFEN
       ========================================= */

    if (!category || !wordList[category]) {

        alert("Ungültiges Thema!");

        window.location.href = "index.html";

        throw new Error("Ungültige Kategorie");
    }


    /* =========================================
       KATEGORIE-TITEL
       ========================================= */

    const categoryName =
        category.charAt(0).toUpperCase() +
        category.slice(1);

    gameTitle.textContent =
        `Hangman - ${categoryName}`;


    /* =========================================
       WORTLISTE
       ========================================= */

    const selectedList =
        wordList[category];


    /* =========================================
       HILFSFUNKTION:
       FLASH-TIMER STOPPEN
       ========================================= */

    function clearFlash() {

        statusEl.classList.remove('flash');

        if (flashTimeout) {
            clearTimeout(flashTimeout);
            flashTimeout = null;
        }
    }


    /* =========================================
       HILFSFUNKTION:
       INPUT-FARBE ZURÜCKSETZEN
       ========================================= */

    function resetInputStyle() {

        letterInput.classList.remove(
            'correct',
            'incorrect'
        );

        letterInput.style.animation = '';
    }


    /* =========================================
       SPIEL STARTEN / RESET
       ========================================= */

    function startGame() {

        if (!selectedList || selectedList.length === 0) {

            alert("Für dieses Thema wurden keine Wörter gefunden.");

            return;
        }


        /* Zufälliges Wort auswählen */

        selectedWord =
            selectedList[
                Math.floor(
                    Math.random() * selectedList.length
                )
            ].toLowerCase();


        /* Geratene Buchstaben zurücksetzen */

        guessedLetters = [];


        /* Falsche Buchstaben zurücksetzen */

        incorrectLetters = [];


        /* Versuche zurücksetzen */

        remainingAttempts = 10;


        /* Spielstatus */

        gameOver = false;


        /* Anzeige zurücksetzen */

        wordDisplay.classList.remove('lose');

        statusEl.classList.remove(
            'win-message',
            'lose-message'
        );

        clearFlash();


        /* Eingabefeld aktivieren */

        letterInput.disabled = false;

        letterInput.value = '';

        resetInputStyle();


        /* Erstes Galgenbild */

        gallowsImage.src =
            gallowsImages[0];


        /* Anzeige aktualisieren */

        updateDisplay();


        /* Startmeldung */

        statusEl.textContent =
            "Versuche, das Wort zu erraten!";


        /* Fokus setzen */

        setTimeout(() => {
            letterInput.focus();
        }, 100);
    }


    /* =========================================
       WORT ANZEIGEN
       ========================================= */

    function updateWordDisplay() {

        wordDisplay.innerHTML = '';


        for (
            let i = 0;
            i < selectedWord.length;
            i++
        ) {

            const letterSpan =
                document.createElement('span');


            const letter =
                selectedWord[i];


            /*
             * Leerzeichen und Bindestriche
             * automatisch anzeigen.
             */

            if (
                letter === ' ' ||
                letter === '-' ||
                letter === '/'
            ) {

                letterSpan.textContent =
                    letter;

            }

            /*
             * Buchstabe wurde geraten
             */

            else if (
                guessedLetters.includes(letter)
            ) {

                letterSpan.textContent =
                    i === 0
                        ? letter.toUpperCase()
                        : letter;

            }

            /*
             * Buchstabe noch nicht geraten
             */

            else {

                letterSpan.textContent = '_';
            }


            wordDisplay.appendChild(letterSpan);
        }
    }


    /* =========================================
       GESAMTE ANZEIGE AKTUALISIEREN
       ========================================= */

    function updateDisplay() {

        updateWordDisplay();


        incorrectLettersDisplay.textContent =
            incorrectLetters.length > 0
                ? "Buchstaben: " +
                  incorrectLetters.join(', ')
                : "";


        if (!gameOver) {

            statusEl.textContent =
                `Versuche übrig: ${remainingAttempts}`;
        }
    }


    /* =========================================
       MELDUNG ANZEIGEN
       ========================================= */

    function showMessage(message) {

        statusEl.textContent =
            message;


        clearFlash();


        /*
         * Animation neu starten
         */

        void statusEl.offsetWidth;


        statusEl.classList.add('flash');


        flashTimeout =
            setTimeout(() => {

                statusEl.classList.remove('flash');

                flashTimeout = null;


                if (!gameOver) {

                    statusEl.textContent =
                        `Versuche übrig: ${remainingAttempts}`;
                }

            }, 2000);
    }


    /* =========================================
       PRÜFEN, OB DAS WORT GEWONNEN WURDE
       ========================================= */

    function hasWon() {

        for (
            let i = 0;
            i < selectedWord.length;
            i++
        ) {

            const letter =
                selectedWord[i];


            /*
             * Leerzeichen, Bindestriche usw.
             * müssen nicht geraten werden.
             */

            if (
                letter === ' ' ||
                letter === '-' ||
                letter === '/'
            ) {
                continue;
            }


            if (
                !guessedLetters.includes(letter)
            ) {

                return false;
            }
        }


        return true;
    }


    /* =========================================
       BUCHSTABE RATEN
       ========================================= */

    function guessLetter() {

        if (gameOver) {
            return;
        }


        clearFlash();


        const letter =
            letterInput.value
                .toLowerCase()
                .trim();


        letterInput.value = '';


        /* =====================================
           EINGABE PRÜFEN
           ===================================== */

        if (!letter) {

            showMessage(
                "Bitte einen Buchstaben eingeben!"
            );

            letterInput.focus();

            return;
        }


        /* =====================================
           UMLAUTE
           ===================================== */

        if (letter === 'ä') {

            showMessage(
                "Bitte 'ae' statt 'ä' verwenden!"
            );

            letterInput.focus();

            return;
        }


        if (letter === 'ö') {

            showMessage(
                "Bitte 'oe' statt 'ö' verwenden!"
            );

            letterInput.focus();

            return;
        }


        if (letter === 'ü') {

            showMessage(
                "Bitte 'ue' statt 'ü' verwenden!"
            );

            letterInput.focus();

            return;
        }


        if (letter === 'ß') {

            showMessage(
                "Bitte 'ss' statt 'ß' verwenden!"
            );

            letterInput.focus();

            return;
        }


        /* =====================================
           NUR EINEN BUCHSTABEN ERLAUBEN
           ===================================== */

        if (
            letter.length !== 1 ||
            !/^[a-z]$/.test(letter)
        ) {

            showMessage(
                "Bitte einen Buchstaben eingeben!"
            );

            letterInput.focus();

            return;
        }


        /* =====================================
           BEREITS GERATEN?
           ===================================== */

        if (
            guessedLetters.includes(letter) ||
            incorrectLetters.includes(letter)
        ) {

            showMessage(
                "Buchstabe wurde schon benutzt!"
            );

            letterInput.focus();

            return;
        }


        /* =====================================
           RICHTIGER BUCHSTABE
           ===================================== */

        if (selectedWord.includes(letter)) {

            guessedLetters.push(letter);


            /* Input grün */

            letterInput.classList.remove(
                'incorrect'
            );

            letterInput.classList.add(
                'correct'
            );


            /*
             * Animation neu starten
             */

            letterInput.style.animation = 'none';

            void letterInput.offsetWidth;

            letterInput.style.animation = '';


            updateDisplay();


            /* =================================
               GEWONNEN?
               ================================= */

            if (hasWon()) {

                winGame();

                return;
            }
        }


        /* =====================================
           FALSCHER BUCHSTABE
           ===================================== */

        else {

            incorrectLetters.push(letter);

            remainingAttempts--;


            /* Input rot */

            letterInput.classList.remove(
                'correct'
            );

            letterInput.classList.add(
                'incorrect'
            );


            /*
             * Animation neu starten
             */

            letterInput.style.animation = 'none';

            void letterInput.offsetWidth;

            letterInput.style.animation = '';


            /* =================================
               GALGENBILD AKTUALISIEREN
               ================================= */

            const errorCount =
                10 - remainingAttempts;


            /*
             * errorCount entspricht direkt
             * dem Index des Bildes.
             *
             * 0 Fehler  = hm01
             * 1 Fehler  = hm02
             * ...
             * 10 Fehler = hm11
             */

            gallowsImage.src =
                gallowsImages[
                    Math.min(
                        errorCount,
                        gallowsImages.length - 1
                    )
                ];


            updateDisplay();


            /* =================================
               VERLOREN?
               ================================= */

            if (remainingAttempts <= 0) {

                loseGame();

                return;
            }
        }


        letterInput.focus();
    }


    /* =========================================
       GEWONNEN
       ========================================= */

    function winGame() {

        gameOver = true;


        clearFlash();


        statusEl.textContent =
            "Du hast gewonnen!";


        statusEl.classList.remove(
            'lose-message'
        );

        statusEl.classList.add(
            'win-message'
        );


        /*
         * Siegerbild
         */

        gallowsImage.src =
            "images/siegerbild.png";


        updateWordDisplay();


        /*
         * Alle Buchstaben anzeigen
         */

        for (
            let i = 0;
            i < selectedWord.length;
            i++
        ) {

            if (
                selectedWord[i] === ' ' ||
                selectedWord[i] === '-' ||
                selectedWord[i] === '/'
            ) {
                continue;
            }


            const span =
                wordDisplay.children[i];


            if (span) {

                span.textContent =
                    selectedWord[i].toUpperCase();
            }
        }


        letterInput.disabled = true;
    }


    /* =========================================
       VERLOREN
       ========================================= */

    function loseGame() {

        gameOver = true;


        clearFlash();


        statusEl.textContent =
            "Du hast verloren!";


        statusEl.classList.remove(
            'win-message'
        );

        statusEl.classList.add(
            'lose-message'
        );


        wordDisplay.classList.add(
            'lose'
        );


        /*
         * Ganzes Wort anzeigen
         */

        wordDisplay.innerHTML = '';


        for (
            let i = 0;
            i < selectedWord.length;
            i++
        ) {

            const letterSpan =
                document.createElement('span');


            letterSpan.textContent =
                selectedWord[i] === ' '
                    ? ' '
                    : selectedWord[i].toUpperCase();


            wordDisplay.appendChild(
                letterSpan
            );
        }


        /*
         * Letztes Galgenbild
         */

        gallowsImage.src =
            gallowsImages[
                gallowsImages.length - 1
            ];


        /*
         * Falsche Buchstaben anzeigen
         */

        incorrectLettersDisplay.textContent =
            "Buchstaben: " +
            incorrectLetters.join(', ');


        /*
         * Spiel beenden
         */

        letterInput.disabled = true;
    }


    /* =========================================
       SPIEL BEENDEN
       ========================================= */

    function endGame() {

        gameOver = true;

        letterInput.disabled = true;
    }


    /* =========================================
       ZURÜCK ZUR AUSWAHL
       ========================================= */

    function goBack() {

        window.location.href =
            "index.html";
    }


    /* =========================================
       RESET
       ========================================= */

    function resetGame() {

        startGame();
    }


    /* =========================================
       ENTER-TASTE
       ========================================= */

    document.addEventListener(
        'keydown',
        function(event) {

            if (event.key !== 'Enter') {
                return;
            }


            event.preventDefault();


            if (gameOver) {

                resetGame();

            } else {

                guessLetter();
            }
        }
    );


    /* =========================================
       FEHLER BEI GALGENBILDERN ERKENNEN
       ========================================= */

    gallowsImage.onerror =
        function() {

            console.error(
                "Galgenbild konnte nicht geladen werden:",
                this.src
            );
        };


    /* =========================================
       ERSTEN SPIELSTART
       ========================================= */

    startGame();

</script>

</body>

</html>
