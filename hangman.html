<!DOCTYPE html>
<html lang="de">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    >

    <title>Hangman - Spiel</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }


        body {

            font-family: Arial, sans-serif;

            background:
                url('images/Friedhof.png')
                no-repeat
                center
                center
                fixed;

            background-size: cover;

            color: #333;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            min-height: 100dvh;

            overflow: hidden;

            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);

            padding: 10px;
        }


        /* =========================================
           SPIEL-CONTAINER
           ========================================= */

        .game-container {

            width: min(420px, 94vw);

            max-height: 96vh;
            max-height: 96dvh;

            text-align: center;

            border: 2px solid #333;
            border-radius: 12px;

            padding: 20px;

            background: rgba(0, 0, 0, 0.65);

            position: relative;

            animation: fadeIn 1s ease-out;

            overflow-y: auto;
            overflow-x: hidden;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.5);

            -webkit-overflow-scrolling: touch;
        }


        /* =========================================
           ANIMATION
           ========================================= */

        @keyframes fadeIn {

            0% {
                opacity: 0;
                transform: translateY(20px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================
           TITEL
           ========================================= */

        h1 {

            font-size: clamp(20px, 6vw, 28px);

            line-height: 1.2;

            margin: 0 0 20px 0;

            color: white;

            word-break: break-word;
        }


        /* =========================================
           WORT
           ========================================= */

        .word {

            width: 100%;

            min-height: 50px;
            height: auto;

            margin: 0 auto 8px auto;

            display: flex;

            justify-content: center;
            align-items: center;

            flex-wrap: wrap;

            color: #39ff14;

            font-size: clamp(22px, 7vw, 30px);

            line-height: 1.35;

            overflow: visible;

            overflow-wrap: anywhere;

            padding: 0 2px;
        }


        .word span {

            display: inline-flex;

            width: 26px;
            min-width: 26px;

            height: 38px;

            justify-content: center;
            align-items: center;

            text-align: center;

            flex: 0 0 26px;
        }


        #wordDisplay.lose {

            color: red;

            font-weight: bold;
        }


        /* =========================================
           STATUS
           ========================================= */

        .status {

            font-size: 19px;

            font-weight: bold;

            line-height: 1.3;

            margin-top: 15px;

            min-height: 30px;

            color: white;
        }


        /* =========================================
           GALGEN
           ========================================= */

        .gallows-container {

            margin-top: 15px;

            text-align: center;
        }


        #gallowsImage {

            display: block;

            width: min(200px, 55vw);

            max-height: 190px;

            height: auto;

            object-fit: contain;

            margin: 0 auto;
        }


        /* =========================================
           BILDSCHIRM-TASTATUR
           ========================================= */

        .keyboard {

            width: 100%;

            margin-top: 15px;

            display: flex;

            flex-direction: column;

            align-items: center;

            gap: 6px;
        }


        .keyboard-row {

            display: flex;

            justify-content: center;

            gap: 5px;

            width: 100%;
        }


        .key {

            width: 34px;

            height: 40px;

            padding: 0;

            border: none;

            border-radius: 5px;

            background-color: #555;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition:
                background-color 0.15s,
                transform 0.1s,
                box-shadow 0.15s;

            touch-action: manipulation;

            -webkit-tap-highlight-color: transparent;
        }


        .key:hover {

            background-color: #666;

            transform: translateY(-1px);
        }


        .key:active {

            transform: scale(0.94);
        }


        /* Noch nicht benutzt */

        .key.available {

            background-color: #555;
        }


        /* Richtiger Buchstabe */

        .key.correct {

            background-color: #2e9b3f;

            box-shadow:
                0 0 8px rgba(57, 255, 20, 0.6);
        }


        /* Falscher Buchstabe */

        .key.incorrect {

            background-color: #b52b2b;

            box-shadow:
                0 0 8px rgba(255, 0, 0, 0.5);
        }


        /* Deaktivierte Taste */

        .key:disabled {

            cursor: default;

            opacity: 1;
        }


        /* =========================================
           TASTEN-ANIMATIONEN
           ========================================= */

        @keyframes keyCorrect {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.15);
                box-shadow:
                    0 0 15px #39ff14;
            }

            100% {
                transform: scale(1);
            }

        }


        @keyframes keyIncorrect {

            0% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-4px);
            }

            50% {
                transform: translateX(4px);
            }

            75% {
                transform: translateX(-3px);
            }

            100% {
                transform: translateX(0);
            }

        }


        .key.correct.animate {

            animation:
                keyCorrect 0.4s ease-in-out;
        }


        .key.incorrect.animate {

            animation:
                keyIncorrect 0.35s ease-in-out;
        }


        /* =========================================
           GEWONNEN / VERLOREN
           ========================================= */

        .win-message {

            color: #39ff14;
        }


        .lose-message {

            color: red;
        }


        /* =========================================
           BUTTONS
           ========================================= */

        .bottom-buttons {

            display: flex;

            justify-content: center;

            flex-wrap: wrap;

            gap: 6px;

            margin-top: 12px;
        }


        .reset-btn,
        .goBack-btn {

            width: auto;

            height: 36px;

            min-height: 36px;

            padding: 0 14px;

            font-size: 13px;

            line-height: 36px;

            cursor: pointer;

            color: white;

            border: none;

            border-radius: 5px;

            margin: 0;

            transition:
                background-color 0.2s,
                transform 0.2s;

            touch-action: manipulation;
        }


        /* Reset */

        .reset-btn {

            background-color: #e53935;
        }


        .reset-btn:hover {

            background-color: #c62828;
        }

        
        .reset-btn.new-round {

    	    background-color: #2e9b3f;
	}


	.reset-btn.new-round:hover {

    	    background-color: #247d32;
	}


        /* Zurück */

        .goBack-btn {

            background-color: #2196F3;
        }


        .goBack-btn:hover {

            background-color: #1976D2;
        }


        /* =========================================
           TOUCH-GERÄTE
           ========================================= */

        @media (hover: none) {

            button:hover {

                transform: none;
            }

        }


        /* =========================================
           HANDY
           ========================================= */

        @media (max-width: 600px) {

            body {

                padding: 8px;

                overflow: hidden;
            }


            .game-container {

                width: 94vw;

                max-width: 380px;

                max-height: none;

                overflow: visible;

                padding: 12px 10px;
            }


            h1 {

                font-size: 21px;

                margin-bottom: 7px;
            }


            .word {

                min-height: 46px;

                font-size: 25px;

                margin-bottom: 3px;
            }


            .word span {

                width: 25px;

                min-width: 25px;

                height: 35px;

                flex-basis: 25px;
            }


            .status {

                font-size: 16px;

                margin-top: 5px;

                min-height: 21px;
            }


            .gallows-container {

                margin-top: 4px;
            }


            #gallowsImage {

                width: 130px;

                max-height: 120px;
            }


            /* Tastatur */

            .keyboard {

                margin-top: 7px;

                gap: 4px;
            }


            .keyboard-row {

                gap: 4px;
            }


            .bottom-buttons {

                margin-top: 8px;

                gap: 5px;
            }


            .reset-btn,
            .goBack-btn {

                height: 34px;

                min-height: 34px;

                line-height: 34px;

                font-size: 12px;

                padding: 0 12px;
            }
        }


        /* =========================================
           SEHR KLEINE HANDYS
           ========================================= */

        @media (max-width: 380px) {

            .game-container {

                width: 98vw;

                padding: 9px 6px;
            }


            h1 {

                font-size: 19px;

                margin-bottom: 5px;
            }


            .word {

                font-size: 22px;

                line-height: 1.3;

                min-height: 42px;
            }


            .word span {

                width: 22px;

                min-width: 22px;

                height: 31px;

                flex-basis: 22px;
            }


            .status {

                font-size: 15px;
            }


            #gallowsImage {

                width: 105px;

                max-height: 95px;
            }


            .keyboard {

                gap: 3px;
            }


            .keyboard-row {

                gap: 3px;
            }


            .reset-btn,
            .goBack-btn {

                height: 32px;

                min-height: 32px;

                line-height: 32px;

                font-size: 11px;

                padding: 0 10px;
            }
        }


        /* =========================================
           SEHR GERINGE HÖHE
           ========================================= */

        @media (max-height: 600px) {

            body {

                padding-top: 5px;
            }


            .game-container {

                padding: 7px;
            }


            h1 {

                margin-bottom: 3px;

                font-size: 18px;
            }


            .word {

                min-height: 38px;

                margin-bottom: 2px;

                font-size: 21px;
            }


            .status {

                margin-top: 2px;

                min-height: 18px;

                font-size: 14px;
            }


            .gallows-container {

                margin-top: 2px;
            }


            #gallowsImage {

                width: 85px;

                max-height: 75px;
            }


            .keyboard {

                margin-top: 4px;

                gap: 2px;
            }


            .keyboard-row {

                gap: 2px;
            }


            .bottom-buttons {

                margin-top: 4px;
            }
        }

    </style>

</head>


<body>


    <div class="game-container">


        <!-- =====================================
             TITEL
             ===================================== -->

        <h1 id="gameTitle">
            Hangman
        </h1>


        <!-- =====================================
             WORT
             ===================================== -->

        <div
            class="word"
            id="wordDisplay"
        >
            _ _ _ _ _
        </div>


        <!-- =====================================
             STATUS
             ===================================== -->

        <div
            class="status"
            id="status"
        >
            Versuche, das Wort zu erraten!
        </div>


        <!-- =====================================
             GALGEN
             ===================================== -->

        <div class="gallows-container">

            <img
                id="gallowsImage"
                src="images/hm01.png"
                alt="Galgenmännchen"
            >

        </div>


        <!-- =====================================
             BILDSCHIRM-TASTATUR
             ===================================== -->

        <div
            class="keyboard"
            id="keyboard"
        >

            <div class="keyboard-row">

                <button class="key" data-letter="a">A</button>
                <button class="key" data-letter="b">B</button>
                <button class="key" data-letter="c">C</button>
                <button class="key" data-letter="d">D</button>
                <button class="key" data-letter="e">E</button>
                <button class="key" data-letter="f">F</button>
                <button class="key" data-letter="g">G</button>

            </div>


            <div class="keyboard-row">

                <button class="key" data-letter="h">H</button>
                <button class="key" data-letter="i">I</button>
                <button class="key" data-letter="j">J</button>
                <button class="key" data-letter="k">K</button>
                <button class="key" data-letter="l">L</button>
                <button class="key" data-letter="m">M</button>
                <button class="key" data-letter="n">N</button>

            </div>


            <div class="keyboard-row">

                <button class="key" data-letter="o">O</button>
                <button class="key" data-letter="p">P</button>
                <button class="key" data-letter="q">Q</button>
                <button class="key" data-letter="r">R</button>
                <button class="key" data-letter="s">S</button>
                <button class="key" data-letter="t">T</button>
                <button class="key" data-letter="u">U</button>

            </div>


            <div class="keyboard-row">

                <button class="key" data-letter="v">V</button>
                <button class="key" data-letter="w">W</button>
                <button class="key" data-letter="x">X</button>
                <button class="key" data-letter="y">Y</button>
                <button class="key" data-letter="z">Z</button>

            </div>

        </div>


        <!-- =====================================
             BOTTOM BUTTONS
             ===================================== -->

        <div class="bottom-buttons">

            <button
                type="button"
                class="reset-btn"
		id="resetButton"
                onclick="resetGame()"
            >
                Reset
            </button>


            <button
                type="button"
                class="goBack-btn"
                onclick="goBack()"
            >
                Zurück zur Auswahl
            </button>

        </div>


    </div>


    <!-- =========================================
         WORTLISTE
         ========================================= -->

    <script src="words.js"></script>


    <script>


        /* =========================================
           SPIELVARIABLEN
           ========================================= */

        let selectedWord = '';

        let guessedLetters = [];

        let incorrectLetters = [];

        let remainingAttempts = 10;

        let gameOver = false;


        /* =========================================
           GALGENBILDER

           0 Fehler  = hm01
           1 Fehler  = hm02
           ...
           9 Fehler  = hm010
           10 Fehler = hm011
           ========================================= */

        const gallowsImages = [

            "images/hm01.png",
            "images/hm02.png",
            "images/hm03.png",
            "images/hm04.png",
            "images/hm05.png",
            "images/hm06.png",
            "images/hm07.png",
            "images/hm08.png",
            "images/hm09.png",
            "images/hm010.png",
            "images/hm011.png"

        ];

// =========================================
// BILDER VORLADEN
// =========================================

gallowsImages.forEach(src => {
    const img = new Image();
    img.src = src;
});

// Siegerbild ebenfalls vorladen
const winnerImage = new Image();
winnerImage.src = "images/siegerbild.png";

// Hintergrund vorladen
const backgroundImage = new Image();
backgroundImage.src = "images/Friedhof.png";


        /* =========================================
           HTML-ELEMENTE
           ========================================= */

        const gameTitle =
            document.getElementById('gameTitle');

        const wordDisplay =
            document.getElementById('wordDisplay');

        const statusEl =
            document.getElementById('status');

        const gallowsImage =
            document.getElementById(
                'gallowsImage'
            );

        const keyboard =
            document.getElementById('keyboard');

        const keyButtons =
            document.querySelectorAll('.key');

        const resetButton =
    	    document.getElementById('resetButton');


        /* =========================================
           KATEGORIE AUS URL
           ========================================= */

        const urlParams =
            new URLSearchParams(
                window.location.search
            );

        const category =
            urlParams.get('category');


        /* =========================================
           KATEGORIE PRÜFEN
           ========================================= */

        if (
            !category ||
            !wordList[category]
        ) {

            alert("Ungültiges Thema!");

            window.location.href =
                "index.html";

            throw new Error(
                "Ungültige Kategorie"
            );
        }


        /* =========================================
           KATEGORIE-TITEL
           ========================================= */

        const categoryName =
            category.charAt(0).toUpperCase() +
            category.slice(1);

        gameTitle.textContent =
            `Hangman - ${categoryName}`;


        /* =========================================
           WORTLISTE
           ========================================= */

        const selectedList =
            wordList[category];


        /* =========================================
           TASTEN ZURÜCKSETZEN
           ========================================= */

        function resetKeyboard() {

            keyButtons.forEach(
                button => {

                    button.disabled = false;

                    button.classList.remove(
                        'correct',
                        'incorrect',
                        'animate'
                    );

                    button.classList.add(
                        'available'
                    );
                }
            );
        }


        /* =========================================
           SPIEL STARTEN
           ========================================= */

        function startGame() {

            if (
                !selectedList ||
                selectedList.length === 0
            ) {

                alert(
                    "Für dieses Thema wurden keine Wörter gefunden."
                );

                return;
            }


            /* Zufälliges Wort */

            selectedWord =
                selectedList[
                    Math.floor(
                        Math.random() *
                        selectedList.length
                    )
                ].toLowerCase();


            /* Buchstaben zurücksetzen */

            guessedLetters = [];

            incorrectLetters = [];


            /* Versuche */

            remainingAttempts = 10;


            /* Spielstatus */

            gameOver = false;


            /* CSS zurücksetzen */

            wordDisplay.classList.remove(
                'lose'
            );

            statusEl.classList.remove(
                'win-message',
                'lose-message'
            );


	    resetButton.textContent = "Reset";
	    resetButton.classList.remove("new-round");


            /* Tastatur zurücksetzen */

            resetKeyboard();


            /* Galgen zurücksetzen */

            gallowsImage.src =
                gallowsImages[0];


            /* Anzeige */

            updateDisplay();


            statusEl.textContent =
                "Versuche, das Wort zu erraten!";
        }


        /* =========================================
           WORT ANZEIGEN
           ========================================= */

        function updateWordDisplay() {

            wordDisplay.innerHTML = '';


            for (
                let i = 0;
                i < selectedWord.length;
                i++
            ) {

                const letterSpan =
                    document.createElement(
                        'span'
                    );


                const letter =
                    selectedWord[i];


                /*
                 * Leerzeichen und Sonderzeichen
                 * automatisch anzeigen
                 */

                if (
                    letter === ' ' ||
                    letter === '-' ||
                    letter === '/'
                ) {

                    letterSpan.textContent =
                        letter;
                }


                /*
                 * Geratener Buchstabe
                 */

                else if (
                    guessedLetters.includes(
                        letter
                    )
                ) {

                    letterSpan.textContent =
                        i === 0
                            ? letter.toUpperCase()
                            : letter;
                }


                /*
                 * Noch nicht geraten
                 */

                else {

                    letterSpan.textContent =
                        '_';
                }


                wordDisplay.appendChild(
                    letterSpan
                );
            }
        }


        /* =========================================
           ANZEIGE AKTUALISIEREN
           ========================================= */

        function updateDisplay() {

            updateWordDisplay();


            if (!gameOver) {

                statusEl.textContent =
                    `Versuche übrig: ${remainingAttempts}`;
            }
        }


        /* =========================================
           GEWINN PRÜFEN
           ========================================= */

        function hasWon() {

            for (
                let i = 0;
                i < selectedWord.length;
                i++
            ) {

                const letter =
                    selectedWord[i];


                /*
                 * Sonderzeichen zählen
                 * nicht als zu erratende Zeichen
                 */

                if (
                    letter === ' ' ||
                    letter === '-' ||
                    letter === '/'
                ) {

                    continue;
                }


                if (
                    !guessedLetters.includes(
                        letter
                    )
                ) {

                    return false;
                }
            }


            return true;
        }


        /* =========================================
           BUCHSTABE RATEN
           ========================================= */

        function guessLetter(letter) {

            if (gameOver) {
                return;
            }


            letter =
                letter.toLowerCase();


            /* =====================================
               UNGÜLTIGER BUCHSTABE
               ===================================== */

            if (
                !/^[a-z]$/.test(letter)
            ) {

                return;
            }


            /* =====================================
               SCHON BENUTZT
               ===================================== */

            if (
    		guessedLetters.includes(letter) ||
    		incorrectLetters.includes(letter)
	    ) {
    		return;
	    }


            /* =====================================
               PASSENDE TASTE FINDEN
               ===================================== */

            const button =
                document.querySelector(
                    `.key[data-letter="${letter}"]`
                );


            /* =====================================
               RICHTIG
               ===================================== */

            if (
                selectedWord.includes(letter)
            ) {

                guessedLetters.push(
                    letter
                );


                if (button) {

                    button.disabled = true;

                    button.classList.remove(
                        'available'
                    );

                    button.classList.add(
                        'correct'
                    );

                    button.classList.remove(
                        'animate'
                    );

                    void button.offsetWidth;

                    button.classList.add(
                        'animate'
                    );
                }


                updateDisplay();


                /* Gewonnen? */

                if (hasWon()) {

                    winGame();

                    return;
                }
            }


            /* =====================================
               FALSCH
               ===================================== */

            else {

                incorrectLetters.push(
                    letter
                );


                remainingAttempts--;


                if (button) {

                    button.disabled = true;

                    button.classList.remove(
                        'available'
                    );

                    button.classList.add(
                        'incorrect'
                    );

                    button.classList.remove(
                        'animate'
                    );

                    void button.offsetWidth;

                    button.classList.add(
                        'animate'
                    );
                }


                /* =================================
                   GALGENBILD
                   ================================= */

                const errorCount =
                    10 - remainingAttempts;


                gallowsImage.src =
                    gallowsImages[
                        Math.min(
                            errorCount,
                            gallowsImages.length - 1
                        )
                    ];


                updateDisplay();


                /* =================================
                   VERLOREN?
                   ================================= */

                if (
                    remainingAttempts <= 0
                ) {

                    loseGame();

                    return;
                }
            }
        }


        /* =========================================
           GEWONNEN
           ========================================= */

        function winGame() {

            gameOver = true;


            statusEl.textContent =
                "Du hast gewonnen!";


            statusEl.classList.remove(
                'lose-message'
            );


            statusEl.classList.add(
                'win-message'
            );


            resetButton.textContent = "Neue Runde";
	    resetButton.classList.add("new-round");


            /* Siegerbild */

            gallowsImage.src =
                "images/siegerbild.png";


            /* Alle Tasten deaktivieren */

            keyButtons.forEach(
                button => {

                    button.disabled = true;
                }
            );


            /*
             * Wort nochmal vollständig anzeigen
             */

            updateWordDisplay();
        }


        /* =========================================
           VERLOREN
           ========================================= */

        function loseGame() {

            gameOver = true;


            statusEl.textContent =
                "Du hast verloren!";


            statusEl.classList.remove(
                'win-message'
            );


            statusEl.classList.add(
                'lose-message'
            );


            wordDisplay.classList.add(
                'lose'
            );


            /* Ganzes Wort anzeigen */

            wordDisplay.innerHTML = '';


            for (
                let i = 0;
                i < selectedWord.length;
                i++
            ) {

                const letterSpan =
                    document.createElement(
                        'span'
                    );


                letterSpan.textContent =
                    selectedWord[i] === ' '
                        ? ' '
                        : selectedWord[i]
                            .toUpperCase();


                wordDisplay.appendChild(
                    letterSpan
                );
            }

	    
            resetButton.textContent = "Neue Runde";
	    resetButton.classList.add("new-round");


            /* Letztes Galgenbild */

            gallowsImage.src =
                gallowsImages[
                    gallowsImages.length - 1
                ];


            /* Alle Tasten deaktivieren */

            keyButtons.forEach(
                button => {

                    button.disabled = true;
                }
            );
        }


        /* =========================================
           ZURÜCK
           ========================================= */

        function goBack() {

            window.location.href =
                "index.html";
        }


        /* =========================================
           RESET
           ========================================= */

        function resetGame() {

            startGame();
        }


        /* =========================================
           BILDSCHIRM-TASTATUR
           ========================================= */

        keyButtons.forEach(
            button => {

                button.addEventListener(
                    'click',
                    function() {

                        const letter =
                            this.dataset.letter;

                        guessLetter(
                            letter
                        );
                    }
                );
            }
        );


        /* =========================================
           ECHTE TASTATUR
           ========================================= */

        document.addEventListener(
            'keydown',
            function(event) {

                /*
                 * Nur A-Z akzeptieren
                 */

                if (
                    /^[a-zA-Z]$/.test(
                        event.key
                    )
                ) {

                    event.preventDefault();


                    guessLetter(
                        event.key
                    );

                    return;
                }


                /*
                 * Enter = neues Spiel
                 * wenn Spiel vorbei
                 */

                if (
                    event.key === 'Enter' &&
                    gameOver
                ) {

                    event.preventDefault();

                    resetGame();
                }
            }
        );


        /* =========================================
           GALGENBILD FEHLER ERKENNEN
           ========================================= */

        gallowsImage.onerror =
            function() {

                console.error(
                    "Galgenbild konnte nicht geladen werden:",
                    this.src
                );
            };


        /* =========================================
           SPIEL STARTEN
           ========================================= */

        startGame();

    </script>

</body>

</html>
